name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ShellCheck
        run: shellcheck --version && shellcheck build-template.sh add-radio.sh
      - name: SPDX headers
        run: |
          missing=$(git ls-files '*.sh' 'files/*' | while read -r f; do
            awk 'NR <= 5 && /SPDX-FileCopyrightText: Meshtastic contributors/ { c = 1 }
                 NR <= 5 && /SPDX-License-Identifier: GPL-3.0-only/ { l = 1 }
                 NR > 5 { exit } END { exit !(c && l) }' "$f" || echo "$f"
          done)
          [ -z "$missing" ] || { echo "missing SPDX header:"; echo "$missing"; exit 1; }
