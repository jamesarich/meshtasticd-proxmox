#
# meshtasticd joins its UDP multicast group once at startup, which fails if eth0 has no
# address yet. In a container network-online.target is reached before the DHCP lease.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStartPre=/bin/sh -c 'for _ in $(seq 30); do ip -4 -o addr show dev eth0 scope global | grep -q inet && exit 0; sleep 1; done'
